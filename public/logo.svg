<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 68">
  <!-- Isotipo: rounded square with growth bars -->
  <rect x="2" y="6" width="56" height="56" rx="13" fill="#006847"/>
  <!-- Bar 1 (left, short, white) -->
  <rect x="12" y="40" width="9" height="14" rx="2.5" fill="white" fill-opacity="0.5"/>
  <!-- Bar 2 (center, medium, white) -->
  <rect x="25" y="32" width="9" height="22" rx="2.5" fill="white" fill-opacity="0.8"/>
  <!-- Bar 3 (right, tallest, gold) -->
  <rect x="38" y="22" width="9" height="32" rx="2.5" fill="#E8A020"/>
  <!-- Thin vertical separator -->
  <line x1="72" y1="16" x2="72" y2="52" stroke="#006847" stroke-width="1.5" stroke-opacity="0.2"/>
  <!-- CREA logotype -->
  <text x="82" y="45"
    font-family="'Arial Black', Arial, sans-serif"
    font-weight="900"
    font-size="30"
    fill="#006847">CREA</text>
  <!-- Subtitle -->
  <text x="84" y="58"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="7"
    fill="#555"
    letter-spacing="1.2">IYEM · Gobierno de Yucatán</text>
</svg>
